# This repository's actions: its own workflow's (`/`) and the template's, which a generated
# project starts from (copied verbatim, so an update here is safe). Dependabot reads `/` as
# .github/workflows, and any other directory as the YAML files in it (dependabot-core's
# github_actions file fetcher). Grouped: one pull request per directory, so the two may land
# apart -- merge them together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/template/.github/workflows"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
