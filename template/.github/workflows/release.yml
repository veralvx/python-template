# A release tag (`just release`) makes its GitHub release: the package's sdist and wheel, as
# publish.yml builds them, and as notes the release's section of its CHANGELOG.md -- read from
# the tag's own commit, which `just release` wrote it into, so a re-run gives the same notes.
name: Release

on:
  push:
    # a single package's v1.2.3, a workspace member's name-v1.2.3
    tags: ["v[0-9]*", "*-v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r package folder < <(.github/package-tag.sh "$GITHUB_REF_NAME")
          version=${GITHUB_REF_NAME##*v}
          uv build --package "$package" --no-sources
          # the first section, up to the second `## ` heading: the tag's own, or no release
          awk '/^## /{n++} n==1' "$folder/CHANGELOG.md" > notes.md
          [[ $(head -n 1 notes.md) == "## [$version]("* ]]
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$package $version" --notes-file notes.md
