# git-cliff 2.13.1: the changelog (`just changelog`, written by `just release`), from the commits
# -- in a workspace, a package's: those touching its folder. The recipes pass what is project-
# specific: the repository (Repository in pyproject.toml), the tags (`v1.2.3`, a workspace's
# `name-v1.2.3`), a member's folder. Grouped by commit type; a commit's subject is its entry,
# written for the package's users.

[changelog]
header = """
# Changelog

Generated by [git-cliff](https://git-cliff.org) from the conventional commits; versions follow
[Semantic Versioning](https://semver.org).\n
"""
body = """
{% set url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo -%}
{% if version -%}
    ## [{{ version | split(pat="-v") | last | trim_start_matches(pat="v") }}]({{ url }}/\
    {%- if previous.version %}compare/{{ previous.version }}..{{ version }}\
    {%- else %}tree/{{ version }}{% endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif previous.version -%}
    ## [Unreleased]({{ url }}/compare/{{ previous.version }}..HEAD)
{% else -%}
    ## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}{{ commit.scope }}: {% endif %}\
          {{ commit.message | split(pat="\n") | first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# what cog lets through unconventional -- merges, fixups (cog.toml) -- skipped below, unwarned
filter_unconventional = false
protect_breaking_commits = true # a breaking change is listed whatever its type, first
# by type, the HTML comments ordering the groups. Skipped: what changes nothing a user meets --
# the release's own commit (`chore(release)`), chores, CI, formatting -- and cog's ignored ones
commit_parsers = [
    { message = "^(Merge |fixup! |squash! |amend! )", skip = true },
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->Breaking changes" },
    { message = "^(chore|ci|style)", skip = true },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Refactoring" },
    { message = "^build", group = "<!-- 5 -->Build" },
    { message = "^doc", group = "<!-- 6 -->Documentation" },
    { message = "^test", group = "<!-- 7 -->Tests" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", group = "<!-- 9 -->Other" },
]
sort_commits = "oldest"
